<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    This is a Flutter web app served from a GitHub Pages project page,
    therefore the base href has to point to the repository sub path.
    The path has to start and end with a slash "/".
  -->
  <base href="/hermes-tri-log/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Triathlon-Trainingsplan anzeigen und abhaken – lokal, ohne Konto.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tri-Log">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Tri-Log</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Eigener Service Worker: Offline-Betrieb nach dem ersten Aufruf und
    echte PWA-Installation (WebAPK). Flutters Stub-Worker wird in
    flutter_bootstrap.js bewusst nicht registriert (siehe web/sw.js).
    Relativer Pfad + Scope, damit localhost und GitHub Pages beide laufen.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (error) {
        console.warn('Service Worker konnte nicht registriert werden:', error);
      });
    }
  </script>
</body>
</html>
